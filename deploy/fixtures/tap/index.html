<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>سباق النقر</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1222;
        color: #f4f4f8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #aeb3cc;
        margin: 0 0 6px;
      }
      button {
        margin-top: 20px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 0;
        background: #ffb300;
        color: #1a1300;
        font: inherit;
        font-size: 22px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>سباق النقر</h1>
        <p id="status">ننتظر التطبيق…</p>
        <p id="code"></p>
        <button type="button" id="tap">انقر!</button>
        <p id="count">0</p>
      </div>
    </main>
    <script>
      // A fixture game: it waits for the host to inject window.gathering,
      // asks who is playing, and counts taps. Outside the app it says so.
      (function () {
        var status = document.getElementById('status')
        var count = document.getElementById('count')
        var taps = 0
        document.getElementById('tap').addEventListener('click', function () {
          taps += 1
          count.textContent = String(taps)
        })
        var code = new URLSearchParams(location.search).get('code')
        if (code) {
          document.getElementById('code').textContent = 'وصل رمز الدخول (' + code.slice(0, 8) + '…)'
        }
        function ready() {
          if (window.gathering && window.gathering.__installed) return Promise.resolve(window.gathering)
          return new Promise(function (resolve, reject) {
            var timer = setTimeout(function () { reject(new Error('timeout')) }, 10000)
            window.addEventListener('gatheringready', function () {
              clearTimeout(timer)
              resolve(window.gathering)
            }, { once: true })
          })
        }
        ready()
          .then(function (g) { return g.player.me() })
          .then(function (me) {
            status.textContent = 'أهلاً ' + (me && me.nickname ? me.nickname : 'يا لاعب') + '، استعد!'
          })
          .catch(function () {
            status.textContent = 'هذه الصفحة تعمل داخل تطبيق جمعة. افتحها من هناك.'
          })
      })()
    </script>
  </body>
</html>
