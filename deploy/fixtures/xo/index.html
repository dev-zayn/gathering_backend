<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>إكس أو</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1222;
        color: #f4f4f8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #aeb3cc;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        gap: 6px;
        margin: 20px auto 0;
      }
      .grid span {
        height: 56px;
        border-radius: 10px;
        background: #1b1f3a;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>إكس أو</h1>
        <p id="status">ننتظر التطبيق…</p>
        <p id="code"></p>
        <div class="grid" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </main>
    <script>
      // A fixture game: it waits for the host to inject window.gathering,
      // asks who is playing, and says so. Outside the app it says that too.
      (function () {
        var status = document.getElementById('status')
        var code = new URLSearchParams(location.search).get('code')
        if (code) {
          document.getElementById('code').textContent = 'وصل رمز الدخول (' + code.slice(0, 8) + '…)'
        }
        function ready() {
          if (window.gathering && window.gathering.__installed) return Promise.resolve(window.gathering)
          return new Promise(function (resolve, reject) {
            var timer = setTimeout(function () { reject(new Error('timeout')) }, 10000)
            window.addEventListener('gatheringready', function () {
              clearTimeout(timer)
              resolve(window.gathering)
            }, { once: true })
          })
        }
        ready()
          .then(function (g) { return g.player.me() })
          .then(function (me) {
            status.textContent = 'أهلاً ' + (me && me.nickname ? me.nickname : 'يا لاعب') + '، دورك أولاً.'
          })
          .catch(function () {
            status.textContent = 'هذه الصفحة تعمل داخل تطبيق جمعة. افتحها من هناك.'
          })
      })()
    </script>
  </body>
</html>
