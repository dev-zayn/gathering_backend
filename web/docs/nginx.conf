# The developer docs: public, and the address we hand a partner before they
# are one. Its own origin, so the pages sit at the root. The app
# section is a second build under /app/, behind a password the mobile team
# is given.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A redirect names the address the client used, port and all, not the
    # server's idea of its own name.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A single-page app owns its routing, so a deep link this server has never
    # heard of is the app's business rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached until they change their name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The page carries no hash, so it is always revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app section. Everything under it — the page, its scripts,
    # its search index — is behind the password, so nothing of it leaks to a
    # partner, and nothing is cached where a shared machine could keep it.
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        root /usr/share/nginx/private;
        auth_basic "Gathering app";
        auth_basic_user_file /etc/nginx/docs.htpasswd;
        try_files $uri $uri/ /app/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "private, no-cache" always;
    }
}
