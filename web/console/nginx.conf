# The console, and nothing else. The browser calls the API directly at
# VITE_API_URL, a different origin, which is what CORS_ORIGINS on the API is for.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # connect-src names the API and the identity provider, both substituted at
    # build time from the same arguments the bundle is built against.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' __API_ORIGIN__ __SSO_ORIGIN__; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' __API_ORIGIN__ __SSO_ORIGIN__; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' __API_ORIGIN__ __SSO_ORIGIN__; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
